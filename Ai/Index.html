<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Local AI Chat</title>
<style>
  :root {
    --bg:#f6f7f9; --card:#ffffff; --line:#dfe3e8; --text:#1b1f24; --muted:#667085; --accent:#2f6fed; --accent-text:#ffffff;
    --user:#e8f0ff; --bot:#f0f2f5; --bad:#d92d20;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1115; --card:#1a1d24; --line:#2a2f3a; --text:#e8eaee; --muted:#8a909c; --accent:#6ea8ff; --accent-text:#0b1220;
            --user:#1f2d4a; --bot:#232731; --bad:#f87171; }
  }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif; display:flex; flex-direction:column; height:100dvh; }
  header { padding:10px 16px; border-bottom:1px solid var(--line); background:var(--card); display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  header h1 { font-size:1.05rem; margin:0; margin-right:auto; }
  select, input[type=number], textarea, button { font:inherit; color:var(--text); background:var(--card); border:1px solid var(--line); border-radius:8px; padding:8px 10px; }
  button { cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  .primary { background:var(--accent); color:var(--accent-text); border:0; font-weight:600; padding:8px 16px; }
  .panel { padding:10px 16px; border-bottom:1px solid var(--line); background:var(--card); display:flex; flex-direction:column; gap:8px; }
  .panel[hidden], .banner[hidden] { display:none; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  progress { width:100%; height:10px; accent-color:var(--accent); }
  .hint { color:var(--muted); font-size:.85rem; }
  .banner { margin:12px 16px 0; padding:10px 12px; border-radius:8px; background:color-mix(in srgb, var(--bad) 14%, transparent); color:var(--bad); font-size:.9rem; }
  #msgs { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:12px; }
  .msg { max-width:min(760px, 92%); padding:10px 14px; border-radius:14px; overflow-wrap:anywhere; }
  .msg.user { align-self:flex-end; background:var(--user); white-space:pre-wrap; }
  .msg.assistant { align-self:flex-start; background:var(--bot); }
  .msg details { color:var(--muted); font-size:.88rem; margin-bottom:8px; }
  .msg details div { white-space:pre-wrap; border-left:3px solid var(--line); padding-left:10px; margin-top:4px; }
  .msg pre { background:rgba(127,127,127,.15); padding:10px; border-radius:8px; overflow-x:auto; margin:8px 0; }
  .msg code { font-family:ui-monospace,Consolas,monospace; font-size:.9em; background:rgba(127,127,127,.15); padding:1px 5px; border-radius:4px; }
  .msg pre code { background:none; padding:0; }
  .msg .err { color:var(--bad); }
  .empty { margin:auto; color:var(--muted); text-align:center; padding:24px; max-width:420px; }
  form { display:flex; gap:8px; padding:12px 16px calc(12px + env(safe-area-inset-bottom)); border-top:1px solid var(--line); background:var(--card); }
  form textarea { flex:1; resize:none; min-height:44px; max-height:160px; }
  form button { min-height:44px; }
  #sys { width:100%; min-height:60px; resize:vertical; }
</style>
</head>
<body>
<header>
  <h1>Local AI Chat</h1>
  <button id="settingsBtn" type="button">Settings</button>
  <button id="clear" type="button">New chat</button>
</header>

<div class="panel" id="loader">
  <div class="row">
    <select id="model" aria-label="Model"></select>
    <button class="primary" id="load" type="button">Load model</button>
  </div>
  <progress id="bar" max="1" value="0" hidden></progress>
  <div class="hint" id="loadText">The model runs in this browser on your own graphics card. Nothing you type leaves this device. The first load downloads the model once, then it is cached.</div>
</div>

<div class="panel" id="settings" hidden>
  <textarea id="sys" aria-label="System prompt" placeholder="System prompt (how the AI should behave)"></textarea>
  <div class="row">
    <label>Temperature <input type="number" id="temp" min="0" max="2" step="0.1" value="0.7" style="width:80px"></label>
    <span class="hint">Saved in this browser.</span>
  </div>
</div>

<div class="banner" id="warn" hidden></div>
<div id="msgs"></div>
<form id="composer">
  <textarea id="input" rows="1" placeholder="Load a model first…" disabled></textarea>
  <button class="primary" id="send" type="submit" disabled>Send</button>
</form>

<script type="module">
const $ = s => document.querySelector(s);
const LIB = 'https://cdn.jsdelivr.net/npm/@mlc-ai/web-llm@0.2.80/+esm';
const store = {
  get(k, d) { try { const v = localStorage.getItem('localai.' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('localai.' + k, JSON.stringify(v)); } catch (e) {} },
};
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
function md(text) {
  return text.split('```').map((p, i) => i % 2
    ? '<pre><code>' + esc(p.replace(/^[^\n]*\n/, '')) + '</code></pre>'
    : esc(p).replace(/`([^`\n]+)`/g, '<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br>')
  ).join('');
}

let webllm = null, engine = null, loading = false, generating = false, loadedId = '';
let chat = store.get('chat', []);

function warn(text) { const w = $('#warn'); w.hidden = !text; w.textContent = text || ''; }

/* ---- messages ---- */
function split(raw) {  // Qwen3 and similar put their reasoning in <think>…</think>
  const m = raw.match(/^\s*<think>([\s\S]*?)(<\/think>|$)/);
  if (!m) return { think: '', answer: raw, open: false };
  return { think: m[1].trim(), answer: raw.slice(m[0].length).trim(), open: m[2] === '' };
}
function fill(el, m) {
  if (m.role === 'user') { el.textContent = m.content; return; }
  const p = split(m.content);
  let h = '';
  if (p.think) h += '<details' + (p.open ? ' open' : '') + '><summary>Thinking</summary><div>' + esc(p.think) + '</div></details>';
  h += md(p.answer);
  if (m.error) h += '<div class="err">' + esc(m.error) + '</div>';
  el.innerHTML = h || '…';
}
function render() {
  const box = $('#msgs'); box.textContent = '';
  if (!chat.length) {
    const e = document.createElement('div'); e.className = 'empty';
    e.textContent = engine ? 'Say something to start chatting.' : 'Pick a model above and press “Load model”. Small models are fast but not very smart; bigger ones need more graphics memory.';
    box.appendChild(e); return;
  }
  chat.forEach(m => { const d = document.createElement('div'); d.className = 'msg ' + m.role; fill(d, m); box.appendChild(d); });
  box.scrollTop = box.scrollHeight;
}
function save() { store.set('chat', chat.slice(-60).map(m => ({ role: m.role, content: m.content }))); }

/* ---- model list ---- */
async function gpuInfo() {
  if (!navigator.gpu) return { ok: false, f16: false };
  try { const a = await navigator.gpu.requestAdapter(); return a ? { ok: true, f16: a.features.has('shader-f16') } : { ok: false, f16: false }; }
  catch (e) { return { ok: false, f16: false }; }
}
function fillModels(gpu) {
  const quant = gpu.f16 ? 'q4f16_1' : 'q4f32_1';
  const list = webllm.prebuiltAppConfig.model_list
    .filter(m => !m.model_type && m.model_id.includes(quant) && !/-1k$/.test(m.model_id))
    .sort((a, b) => a.vram_required_MB - b.vram_required_MB);
  const sel = $('#model'); sel.textContent = '';
  list.forEach(m => {
    const o = document.createElement('option'); o.value = m.model_id;
    o.textContent = m.model_id.replace(/-q4f\d+_1-MLC$/, '') + ' · needs ~' + (m.vram_required_MB / 1024).toFixed(1) + ' GB';
    sel.appendChild(o);
  });
  const saved = store.get('model', '');
  const pick = list.find(m => m.model_id === saved) || list.find(m => m.model_id.startsWith('Qwen3-1.7B')) || list.find(m => m.model_id.startsWith('Llama-3.2-1B')) || list[0];
  if (pick) sel.value = pick.model_id;
}

/* ---- load ---- */
$('#load').onclick = async () => {
  if (loading || !webllm) return;
  const id = $('#model').value;
  if (!id) return;
  loading = true; warn('');
  $('#load').disabled = true; $('#model').disabled = true; $('#bar').hidden = false; $('#bar').value = 0;
  $('#input').disabled = true; $('#send').disabled = true;
  try {
    if (engine) { try { await engine.unload(); } catch (e) {} engine = null; }
    engine = await webllm.CreateMLCEngine(id, {
      initProgressCallback: r => { $('#bar').value = r.progress || 0; $('#loadText').textContent = r.text || ''; },
    });
    loadedId = id; store.set('model', id);
    $('#loadText').textContent = 'Loaded ' + id.replace(/-q4f\d+_1-MLC$/, '') + '. It runs on this device, nothing is sent anywhere.';
    $('#input').disabled = false; $('#send').disabled = false; $('#input').placeholder = 'Message… (Enter to send, Shift+Enter for a new line)';
    $('#loader').hidden = true; $('#settingsBtn').textContent = 'Settings'; render(); $('#input').focus();
  } catch (e) {
    engine = null;
    warn('Could not load the model: ' + (e && e.message ? e.message : e) + ' Try a smaller one.');
    $('#loadText').textContent = '';
  } finally {
    loading = false; $('#load').disabled = false; $('#model').disabled = false; $('#bar').hidden = true;
  }
};
$('#model').addEventListener('change', () => { if (engine && $('#model').value !== loadedId) $('#loader').hidden = false; });

/* ---- chatting ---- */
function setGenerating(g) {
  generating = g;
  const b = $('#send'); b.textContent = g ? 'Stop' : 'Send'; b.type = g ? 'button' : 'submit';
}
$('#send').addEventListener('click', () => { if (generating && engine) engine.interruptGenerate(); });
$('#composer').addEventListener('submit', async ev => {
  ev.preventDefault();
  const text = $('#input').value.trim();
  if (!text || generating || !engine) return;
  $('#input').value = ''; grow();
  chat.push({ role: 'user', content: text });
  const reply = { role: 'assistant', content: '', error: '' };
  chat.push(reply); render();
  const el = $('#msgs').lastElementChild;
  setGenerating(true);
  const sys = $('#sys').value.trim();
  const temp = parseFloat($('#temp').value);
  try {
    const stream = await engine.chat.completions.create({
      stream: true, temperature: isNaN(temp) ? 0.7 : temp,
      messages: [...(sys ? [{ role: 'system', content: sys }] : []), ...chat.slice(0, -1).map(m => ({ role: m.role, content: m.content }))],
    });
    for await (const c of stream) {
      const d = c.choices[0] && c.choices[0].delta && c.choices[0].delta.content;
      if (d) {
        reply.content += d;
        const box = $('#msgs'), near = box.scrollHeight - box.scrollTop - box.clientHeight < 80;
        fill(el, reply); if (near) box.scrollTop = box.scrollHeight;
      }
    }
  } catch (e) { reply.error = e && e.message ? e.message : String(e); }
  setGenerating(false);
  if (!reply.content && !reply.error) reply.content = '(stopped)';
  fill(el, reply); save();
});
$('#clear').onclick = async () => { if (generating && engine) engine.interruptGenerate(); chat = []; save(); render(); try { if (engine) await engine.resetChat(); } catch (e) {} };
function grow() { const t = $('#input'); t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight, 160) + 'px'; }
$('#input').addEventListener('input', grow);
$('#input').addEventListener('keydown', ev => { if (ev.key === 'Enter' && !ev.shiftKey && !ev.isComposing) { ev.preventDefault(); $('#composer').requestSubmit(); } });

/* ---- settings ---- */
$('#settingsBtn').onclick = () => {
  if (engine && $('#loader').hidden) { $('#loader').hidden = false; $('#settings').hidden = false; }
  else $('#settings').hidden = !$('#settings').hidden;
};
$('#sys').value = store.get('sys', 'You are a helpful, friendly assistant. Keep answers clear and to the point.');
$('#temp').value = store.get('temp', 0.7);
$('#sys').addEventListener('change', () => store.set('sys', $('#sys').value));
$('#temp').addEventListener('change', () => store.set('temp', $('#temp').value));

/* ---- start ---- */
render();
(async () => {
  $('#load').disabled = true;
  const gpu = await gpuInfo();
  if (!gpu.ok) warn('This browser has no WebGPU, so it can\'t run the model. Use Chrome or Edge (version 113 or newer) on a computer or a recent Android phone.');
  try { webllm = await import(LIB); }
  catch (e) { warn('Could not load the AI library (no internet?). It is fetched once from a CDN. ' + (e && e.message ? e.message : '')); return; }
  fillModels(gpu);
  $('#load').disabled = !gpu.ok;
})();
</script>
</body>
</html>
